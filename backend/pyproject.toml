[project]
name = "gaswise-api"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx[http2]>=0.28,<1",
    "pydantic-settings>=2.8,<3",
]
[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
[dependency-groups]
dev = ["playwright>=1.55,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.hatch.build.targets.wheel]
packages = ["gaswise"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
