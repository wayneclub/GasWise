name: Test and Deploy GasWise

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gaswise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Host Diagnostics and Resource Cleanup
        run: |
          echo "=== HOST METRICS BEFORE CLEANUP ==="
          uptime
          free -m
          df -h
          echo "=== CLEANING DANGLING BUILD CACHE ==="
          docker builder prune -f --keep-storage 1GB || true
          docker container prune -f || true
          free -m
      - name: Deploy GasWise on Production Server
        run: |
          /home/ubuntu/apps/gaswise/deploy-local.sh
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gaswise.wayneclub.com/ -o /dev/null
          echo "GasWise is live and healthy at https://gaswise.wayneclub.com/"
