name: Test and Deploy GasWise

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gaswise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Reset Docker Daemon and Free Stale Locks
        run: |
          echo "=== SYSTEM METRICS ==="
          uptime
          free -m
          echo "=== RESTARTING DOCKER DAEMON ==="
          sudo systemctl restart docker || true
          sleep 4
          docker ps
      - name: Deploy GasWise on Production Server
        run: |
          /home/ubuntu/apps/gaswise/deploy-local.sh
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gaswise.wayneclub.com/ -o /dev/null
          echo "GasWise is live and healthy at https://gaswise.wayneclub.com/"
