name: Test and Deploy GasWise

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gaswise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: System Diagnostics and Service Readiness
        run: |
          echo "=== SYSTEM METRICS ==="
          uptime
          free -m
          echo "=== DOCKER VOLUMES ==="
          docker volume ls
          echo "=== COMPOSE FILES ON HOST ==="
          find /home/ubuntu -maxdepth 3 \( -name "*compose*.yml" -o -name "*compose*.yaml" \) 2>/dev/null || true
          echo "=== SYSTEMCTL SERVICES ==="
          systemctl list-unit-files | grep -iE "postgres|gaswise" || true
          echo "=== CHECKING GASWISE ENV DATABASE_URL ==="
          grep -i "DATABASE_URL" /home/ubuntu/apps/gaswise/.env | sed -E 's/(:\/\/.*:)(.*)(@.*)/\1****\3/' || true
      - name: Deploy GasWise on Production Server
        run: |
          /home/ubuntu/apps/gaswise/deploy-local.sh
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gaswise.wayneclub.com/ -o /dev/null
          echo "GasWise is live and healthy at https://gaswise.wayneclub.com/"
      - name: Diagnostic Logs on Failure
        if: always()
        run: |
          echo "=== DOCKER LOGS GASWISE-BACKEND ==="
          docker logs --tail 100 gaswise-backend || true
          echo "=== DOCKER LOGS GASWISE-FRONTEND ==="
          docker logs --tail 100 gaswise-frontend || true
          echo "=== DOCKER PS ==="
          docker ps -a
