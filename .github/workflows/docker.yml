name: Test and Deploy GasWise

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gaswise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: System Diagnostics and Service Readiness
        run: |
          echo "=== SYSTEM METRICS ==="
          uptime
          free -m
          echo "=== BRING UP CORE DOCKER INFRASTRUCTURE ==="
          if [ -d /home/ubuntu/docker ]; then
            (cd /home/ubuntu/docker && docker compose up -d) || true
          fi
          echo "=== DOCKER PS ==="
          docker ps
          echo "=== MEMORY BUFFER RELIEF ==="
          sudo sync || true
          echo 3 | sudo tee /proc/sys/vm/drop_caches || true
          free -m
      - name: Deploy GasWise on Production Server
        run: |
          /home/ubuntu/apps/gaswise/deploy-local.sh
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gaswise.wayneclub.com/ -o /dev/null
          echo "GasWise is live and healthy at https://gaswise.wayneclub.com/"
      - name: Diagnostic Logs on Failure
        if: always()
        run: |
          echo "=== DOCKER LOGS GASWISE-BACKEND ==="
          docker logs --tail 100 gaswise-backend || true
          echo "=== DOCKER LOGS GASWISE-FRONTEND ==="
          docker logs --tail 100 gaswise-frontend || true
          echo "=== DOCKER PS ==="
          docker ps -a
